<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TubeShelf</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      min-height: 160px;
      font-family: "Roboto", Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo span { color: #ff0000; }

    .sign-out {
      font-size: 12px;
      color: #aaa;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .sign-out:hover { color: #fff; }

    .status {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 14px;
    }

    .status .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: #666; }
    .status .value { color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status .value.dim { color: #555; font-style: italic; }

    .playlists {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
      max-height: 140px;
      overflow-y: auto;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #1a1a1a;
    }

    .badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .badge.new { background: #1a3a1a; color: #4caf50; }
    .badge.exists { background: #1a1a3a; color: #64b5f6; }
    .badge.dup { background: #2a2a2a; color: #888; }

    .not-signed-in {
      text-align: center;
      padding: 20px 0;
    }
    .not-signed-in p { color: #aaa; font-size: 13px; margin-bottom: 14px; }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 10px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: #cc0000; }

    .empty { color: #555; font-size: 12px; font-style: italic; }
    .error-msg { color: #e57373; font-size: 12px; margin-bottom: 10px; }

    .time { font-size: 11px; color: #555; text-align: right; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Tube<span>Shelf</span></div>
    <button class="sign-out" id="signOut" style="display:none">Sign out</button>
  </div>

  <div id="main"></div>

  <script src="popup.js"></script>
</body>
</html>
